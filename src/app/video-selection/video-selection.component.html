<!-- TV layout: cinematic backdrop + info panel -->
<div *ngIf="!layout.isCompactLayout && currentBox.posterUrl" id="backgroundPlacer" class="tv-only-block" #backgroundPlacer>
  <img [src]="poster | safeUrl" id="backgroundImg" (load)="onImageLoad()" #image>
</div>

<div id="wrapper" #wrapper [class.compact-scroll-page]="layout.isCompactLayout">
  <!-- TV layout voting toolbar -->
  <div class="vote-toolbar tv-only-block" *ngIf="!layout.isCompactLayout">
    <button
      *ngIf="voteSession.canStartVoting()"
      type="button"
      class="vote-toolbar-btn"
      (click)="voteSession.enableVoting()">
      Start Voting
    </button>
    <button
      *ngIf="voteSession.canEndVotingEarly()"
      type="button"
      class="vote-toolbar-btn vote-toolbar-btn-end"
      (click)="voteSession.disableVoting()">
      End Voting
    </button>
    <button
      *ngIf="voteSession.isCollecting() && !voteSession.hasUserFinished()"
      type="button"
      class="vote-toolbar-btn vote-toolbar-btn-finish"
      (click)="voteSession.finishSelection()">
      Finish Selection
    </button>
    <span *ngIf="voteSession.shouldShowVoteStatus()" class="vote-status-text">
      {{ voteSession.getStatusText() }}
      <button
        *ngIf="voteSession.canDismissVotingComplete()"
        type="button"
        class="vote-complete-dismiss"
        (click)="voteSession.disableVoting()"
        aria-label="Show all movies">
        &#10005;
      </button>
    </span>
  </div>

  <!-- TV layout info panel -->
  <div id="info" class="tv-only-block">
    <p id="titleStyling">{{currentBox.title}}</p>
    <div id="overview">
      <p>{{currentBox.overview}}</p>
    </div>

    <div id="separator"></div>

    <div *ngIf="currentBox.resolution === '3840x2160'" class="bubbles">
      <p>4K UltraHD</p>
    </div>

    <div *ngIf="currentBox.resolution === '1920x1080'" class="bubbles">
      <p>HD</p>
    </div>

    <div *ngIf="currentBox.audio === 'dts'"class="bubbles">
      <p>Dts HD 5.1</p>
    </div>

    <div *ngIf="currentBox.audio === 'truehd' && isAndroid"class="bubbles">
      <p>Dolby Atmos</p>
    </div>

    <div *ngIf="currentBox.threeD === 1 && isAndroid"class="bubbles">
      <p>3D</p>
    </div>
  </div>

  <!-- Compact fixed top: title, voting controls, search -->
  <div class="compact-video-selection-top compact-only-block" *ngIf="layout.isCompactLayout">
    <div class="compact-page-header">
      <h1 class="compact-page-title">Movies</h1>
    </div>

    <div class="compact-toolbar-row">
      <div class="compact-vote-actions">
        <button
          *ngIf="voteSession.canStartVoting()"
          type="button"
          class="vote-toolbar-btn"
          (click)="voteSession.enableVoting()">
          Start Voting
        </button>
        <button
          *ngIf="voteSession.canEndVotingEarly()"
          type="button"
          class="vote-toolbar-btn vote-toolbar-btn-end"
          (click)="voteSession.disableVoting()">
          End Voting
        </button>
        <button
          *ngIf="voteSession.isCollecting() && !voteSession.hasUserFinished()"
          type="button"
          class="vote-toolbar-btn vote-toolbar-btn-finish"
          (click)="voteSession.finishSelection()">
          Finish
        </button>
      </div>
      <app-compact-search-bar
        placeholder="Search movies"
        [value]="searchQuery"
        (valueChange)="onSearchQueryChange($event)">
      </app-compact-search-bar>
    </div>

    <p *ngIf="voteSession.shouldShowVoteStatus()" class="compact-vote-status">
      {{ voteSession.getStatusText() }}
      <button
        *ngIf="voteSession.canDismissVotingComplete()"
        type="button"
        class="vote-complete-dismiss"
        (click)="voteSession.disableVoting()"
        aria-label="Show all movies">
        &#10005;
      </button>
    </p>
  </div>

  <div
    *ngIf="layout.isCompactLayout"
    class="compact-video-selection-spacer compact-only-block"
    [class.with-status]="voteSession.shouldShowVoteStatus()">
  </div>

  <!-- TV layout: horizontal card strip -->
  <div id="list" #list class="tv-only-block" *ngIf="!layout.isCompactLayout">
    <div class="boxes movie-card" #boxes boxes *ngFor="let movie of visibleMovies; index as i" (mouseover)="onHover(i, 'movies')" (click)="selectMovie(i)">
      <button
        *ngIf="voteSession.isCollecting() && !voteSession.hasUserFinished()"
        type="button"
        class="vote-circle"
        [class.voted]="voteSession.isDraftVoted(getVoteKey(movie))"
        (click)="onVoteClick($event, movie)"
        [attr.aria-label]="voteSession.isDraftVoted(getVoteKey(movie)) ? 'Remove vote for ' + movie.title : 'Vote for ' + movie.title">
        <span class="vote-check" aria-hidden="true">&#10003;</span>
      </button>
      <img [src]="movie.movieCard | safeUrl" class="posterArt">
      <div class="titleCards">
        <p>{{movie.title}}</p>
      </div>
    </div>
    <div *ngIf="isLoadingMore" class="loading-indicator">
      <div class="spinner"></div>
      <p class="loading-text">Loading more movies...</p>
    </div>
  </div>

  <!-- Compact layout: portrait cover art grid -->
  <div class="compact-only-block compact-grid compact-list-scroll" #list *ngIf="layout.isCompactLayout">
    <div class="compact-grid-item movie-card" #boxes boxes *ngFor="let movie of displayMovies" (click)="selectMovie(movie)">
      <button
        *ngIf="voteSession.isCollecting() && !voteSession.hasUserFinished()"
        type="button"
        class="vote-circle"
        [class.voted]="voteSession.isDraftVoted(getVoteKey(movie))"
        (click)="onVoteClick($event, movie)"
        [attr.aria-label]="voteSession.isDraftVoted(getVoteKey(movie)) ? 'Remove vote for ' + movie.title : 'Vote for ' + movie.title">
        <span class="vote-check" aria-hidden="true">&#10003;</span>
      </button>
      <img [src]="(movie.coverArt || movie.movieCard) | safeUrl" class="compact-poster" [alt]="movie.title">
      <p class="compact-poster-title">{{ movie.title }}</p>
    </div>
    <div *ngIf="isSearching" class="compact-grid-item loading-indicator-compact">
      <div class="spinner"></div>
      <p class="loading-text">Searching...</p>
    </div>
    <div *ngIf="isLoadingMore && !isSearchActive" class="compact-grid-item loading-indicator-compact">
      <div class="spinner"></div>
      <p class="loading-text">Loading...</p>
    </div>
  </div>
</div>
