<div *ngIf="!layout.isCompactLayout" id="backgroundPlacer" class="tv-only-block" #backgroundPlacer>
  <img src="{{poster}}" id="backgroundImg" (load)="onImageLoad()" #image>
</div>

<div id="wrapper" #wrapper [class.compact-scroll-page]="layout.isCompactLayout">
  <div id="info" class="tv-only-block">
    <p id="titleStyling">{{currentBox.title}}</p>
    <div id="overview"><p>{{currentBox.overview}}</p></div>
    <div id="separator"></div>
    <div *ngIf="currentBox.resolution === '3840x2160'" class="bubbles"><p>4K UltraHD</p></div>
    <div *ngIf="currentBox.resolution === '1920x1080'" class="bubbles"><p>HD</p></div>
    <div *ngIf="currentBox.audio === 'dts'"class="bubbles"><p>Dts HD 5.1</p></div>
    <div *ngIf="currentBox.audio === 'eac3'"class="bubbles"><p>Dolby Atmos</p></div>
  </div>

  <div class="compact-only-block compact-page-header" *ngIf="layout.isCompactLayout">
    <h1 class="compact-page-title">TV Shows</h1>
  </div>

  <app-compact-search-bar
    *ngIf="layout.isCompactLayout"
    placeholder="Search TV shows"
    [value]="searchQuery"
    (valueChange)="onSearchQueryChange($event)">
  </app-compact-search-bar>

  <div id="list" class="tv-only-block" *ngIf="!layout.isCompactLayout">
    <div class="boxes" #boxes *ngFor="let show of shows; index as i" (mouseover)="onHover(i, 'tv')" (click)="selectShow(i)">
      <img src="{{show.backdropPhotoUrl}}" class="coverArt">
      <div class="titleCards"><p>{{show.title}}</p></div>
    </div>
  </div>

  <div class="compact-only-block compact-grid compact-list-scroll" *ngIf="layout.isCompactLayout">
    <div class="compact-grid-item" #boxes *ngFor="let show of displayShows" (click)="selectShow(show)">
      <img [src]="(show.posterUrl || show.coverArt || show.backdropPhotoUrl) | safeUrl" class="compact-poster" [alt]="show.title">
      <p class="compact-poster-title">{{ show.title }}</p>
    </div>
    <div *ngIf="isSearching" class="compact-grid-item loading-indicator-compact">
      <div class="spinner"></div>
      <p class="loading-text">Searching...</p>
    </div>
  </div>
</div>
